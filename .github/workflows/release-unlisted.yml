name: UVD Unlisted Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: uvd-release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate extension version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid formal UVD version: $VERSION" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; no release work is required for this push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Synchronize formal extension version in build tree
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const files = [
            'ui/popup.js',
            'background/service.js',
            'ui/popup.html'
          ];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            if (file.endsWith('popup.js') || file.endsWith('service.js')) {
              text = text.replace(/const UVD_VERSION='[^']+';/, `const UVD_VERSION='${version}';`);
            } else {
              text = text.replace(/<title>[^<]* - Video Detector<\/title>/, `<title>${version} - Video Detector</title>`);
              text = text.replace(/(<span class="version">)[^<]*(<\/span>)/, `$1${version}$2`);
            }
            fs.writeFileSync(file, text);
          }
          NODE
          grep -F "const UVD_VERSION='$VERSION';" ui/popup.js
          grep -F "const UVD_VERSION='$VERSION';" background/service.js
          grep -F "<span class=\"version\">$VERSION</span>" ui/popup.html

      - name: Validate extension
        if: steps.version.outputs.skip != 'true'
        run: npx --yes web-ext@latest lint --source-dir . --no-input

      - name: Sign extension for self-distribution
        if: steps.version.outputs.skip != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "WEB_EXT_API_KEY / WEB_EXT_API_SECRET GitHub Secrets are required." >&2
            exit 1
          fi
          rm -rf web-ext-artifacts
          npx --yes web-ext@latest sign \
            --source-dir . \
            --artifacts-dir web-ext-artifacts \
            --channel unlisted \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --approval-timeout 900000

      - name: Normalize signed XPI name
        if: steps.version.outputs.skip != 'true'
        id: xpi
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          XPI=$(find web-ext-artifacts -maxdepth 1 -type f -name '*.xpi' | head -n 1)
          if [[ -z "$XPI" ]]; then
            echo "Signed XPI was not produced." >&2
            exit 1
          fi
          TARGET="Universal-Video-Detector-${VERSION}.xpi"
          cp "$XPI" "$TARGET"
          SHA256=$(sha256sum "$TARGET" | awk '{print $1}')
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create Firefox update manifest
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          XPI_SHA256: ${{ steps.xpi.outputs.sha256 }}
        run: |
          cat > update.json <<EOF
          {
            "addons": {
              "universal-video-detector@example.local": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "https://github.com/Phys1cz0/Universal-Video-Detector/releases/download/v${VERSION}/Universal-Video-Detector-${VERSION}.xpi",
                    "update_hash": "sha256:${XPI_SHA256}"
                  }
                ]
              }
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('update.json','utf8'))"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          XPI: ${{ steps.xpi.outputs.path }}
        run: |
          TAG="v${VERSION}"
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git tag -a "$TAG" -m "Universal Video Detector ${VERSION}" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" "$XPI" update.json \
            --title "Universal Video Detector ${VERSION}" \
            --generate-notes

      - name: Verify release assets
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -Fx "Universal-Video-Detector-${VERSION}.xpi"
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -Fx "update.json"
