name: UVD Unlisted Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Formal x.y.z version to submit to Mozilla and publish'
        required: true
        type: string

concurrency:
  group: uvd-formal-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  WEB_EXT_SIGN_RETRIES: 6
  WEB_EXT_SIGN_RETRY_DELAY_SECONDS: 30

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate formal release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid formal UVD version in manifest: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid requested formal version: $REQUESTED_VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match manifest version $VERSION." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing duplicate formal release." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Synchronize formal extension version in build tree
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const files = ['ui/popup.js','background/service.js','ui/popup.html'];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            if (file.endsWith('popup.js') || file.endsWith('service.js')) {
              text = text.replace(/const UVD_VERSION='[^']+';/, `const UVD_VERSION='${version}';`);
            } else {
              text = text.replace(/<title>[^<]* - Video Detector<\/title>/, `<title>${version} - Video Detector</title>`);
              text = text.replace(/(<span class="version">)[^<]*(<\/span>)/, `$1${version}$2`);
            }
            fs.writeFileSync(file, text);
          }
          NODE
          grep -F "const UVD_VERSION='$VERSION';" ui/popup.js
          grep -F "const UVD_VERSION='$VERSION';" background/service.js
          grep -F "<span class=\"version\">$VERSION</span>" ui/popup.html

      - name: Validate extension
        run: npx --yes web-ext@latest lint --source-dir . --no-input --ignore-files 'dev-*.ps1'

      - name: Sign extension for self-distribution
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "WEB_EXT_API_KEY / WEB_EXT_API_SECRET GitHub Secrets are required." >&2
            exit 1
          fi
          rm -rf web-ext-artifacts
          attempt=1
          while true; do
            echo "Mozilla signing attempt ${attempt}/${WEB_EXT_SIGN_RETRIES}"
            rm -f signing.log
            set +e
            npx --yes web-ext@latest sign \
              --source-dir . \
              --artifacts-dir web-ext-artifacts \
              --channel unlisted \
              --api-key "$WEB_EXT_API_KEY" \
              --api-secret "$WEB_EXT_API_SECRET" \
              --approval-timeout 900000 \
              --ignore-files 'dev-*.ps1' 2>&1 | tee signing.log
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then break; fi
            if grep -Fq "Version ${VERSION} already exists." signing.log; then
              echo "Mozilla already has version ${VERSION}; retrieving the existing signed file."
              rm -rf web-ext-artifacts
              mkdir -p web-ext-artifacts
              JWT=$(node <<'NODE'
          const crypto = require('crypto');
          const key = process.env.WEB_EXT_API_KEY;
          const secret = process.env.WEB_EXT_API_SECRET;
          const now = Math.floor(Date.now() / 1000);
          const b64 = value => Buffer.from(value).toString('base64url');
          const header = b64(JSON.stringify({alg:'HS256',typ:'JWT'}));
          const payload = b64(JSON.stringify({iss:key,jti:crypto.randomUUID(),iat:now,exp:now+60}));
          const data = `${header}.${payload}`;
          const signature = crypto.createHmac('sha256', secret).update(data).digest('base64url');
          process.stdout.write(`${data}.${signature}`);
          NODE
              )
              VERSION_JSON=$(curl --fail --silent --show-error -H "Authorization: JWT ${JWT}" -g "https://addons.mozilla.org/api/v3/addons/universal-video-detector@example.local/versions/${VERSION}/")
              FILE_URL=$(node -e "const d=JSON.parse(process.argv[1]); const f=(d.files||[]).find(x=>x.signed===true && x.download_url); if(!f) process.exit(2); process.stdout.write(f.download_url)" "$VERSION_JSON")
              curl --fail --location --silent --show-error -H "Authorization: JWT ${JWT}" -g "$FILE_URL" --output "web-ext-artifacts/Universal-Video-Detector-${VERSION}.xpi"
              node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const path = `web-ext-artifacts/Universal-Video-Detector-${process.env.VERSION}.xpi`;
          if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error('Retrieved Mozilla-signed XPI is missing or empty.');
          const manifest = JSON.parse(cp.execFileSync('unzip',['-p',path,'manifest.json'],{encoding:'utf8'}));
          if (manifest.version !== process.env.VERSION) throw new Error(`Retrieved XPI version mismatch: ${manifest.version}`);
          NODE
              break
            fi
            if (( attempt >= WEB_EXT_SIGN_RETRIES )); then
              echo "Mozilla signing failed after ${WEB_EXT_SIGN_RETRIES} attempts." >&2
              exit 1
            fi
            rm -rf web-ext-artifacts
            echo "Signing request may be throttled or temporarily unavailable; waiting ${WEB_EXT_SIGN_RETRY_DELAY_SECONDS}s before retry."
            sleep "$WEB_EXT_SIGN_RETRY_DELAY_SECONDS"
            attempt=$((attempt + 1))
          done

      - name: Normalize signed XPI name
        id: xpi
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          XPI=$(find web-ext-artifacts -maxdepth 1 -type f -name '*.xpi' | head -n 1)
          if [[ -z "$XPI" ]]; then echo "Signed XPI was not produced." >&2; exit 1; fi
          TARGET="Universal-Video-Detector-${VERSION}.xpi"
          cp "$XPI" "$TARGET"
          SHA256=$(sha256sum "$TARGET" | awk '{print $1}')
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create Firefox update manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          XPI_SHA256: ${{ steps.xpi.outputs.sha256 }}
        run: |
          cat > update.json <<EOF
          {
            "addons": {
              "universal-video-detector@example.local": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "https://github.com/Phys1cz0/Universal-Video-Detector/releases/download/v${VERSION}/Universal-Video-Detector-${VERSION}.xpi",
                    "update_hash": "sha256:${XPI_SHA256}"
                  }
                ]
              }
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('update.json','utf8'))"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          XPI: ${{ steps.xpi.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${VERSION}"
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git tag -a "$TAG" -m "Universal Video Detector ${VERSION}" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" "$XPI" update.json --title "Universal Video Detector ${VERSION}" --generate-notes

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -Fx "Universal-Video-Detector-${VERSION}.xpi"
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -Fx "update.json"
