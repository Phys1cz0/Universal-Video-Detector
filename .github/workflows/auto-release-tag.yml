name: UVD Automatic Release Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag when manifest version is new
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid formal UVD version: $VERSION" >&2
            exit 1
          fi

          TARGET_TAG="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TARGET_TAG}" >/dev/null; then
            echo "Tag ${TARGET_TAG} already exists; no release trigger is needed."
            exit 0
          fi

          highest="0.0.0"
          while IFS= read -r tag; do
            candidate="${tag#v}"
            if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              comparison=$(node -e "
                const a=process.argv[1].split('.').map(Number), b=process.argv[2].split('.').map(Number);
                let c=0; for(let i=0;i<3;i++){if(a[i]>b[i]){c=1;break} if(a[i]<b[i]){c=-1;break}}
                process.stdout.write(String(c));
              " "$candidate" "$highest")
              if [[ "$comparison" == "1" ]]; then
                highest="$candidate"
              fi
            fi
          done < <(git tag --list 'v*.*.*')

          comparison=$(node -e "
            const a=process.argv[1].split('.').map(Number), b=process.argv[2].split('.').map(Number);
            let c=0; for(let i=0;i<3;i++){if(a[i]>b[i]){c=1;break} if(a[i]<b[i]){c=-1;break}}
            process.stdout.write(String(c));
          " "$VERSION" "$highest")
          if [[ "$comparison" != "1" ]]; then
            echo "Manifest version ${VERSION} is not newer than the highest released version ${highest}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TARGET_TAG" -m "Universal Video Detector ${VERSION}" "$GITHUB_SHA"
          git push origin "$TARGET_TAG"
          echo "Created ${TARGET_TAG}; tag push will trigger the signing/release workflow automatically."
